[project]
name = "job-hunter"
version = "0.1.0"
description = "Autonomous LinkedIn job-hunting agent — a CLI and an MCP server for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshath" }]
keywords = ["job-search", "linkedin", "automation", "mcp", "claude", "agent", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.48",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/akshath/job-hunter"
Repository = "https://github.com/akshath/job-hunter"
Issues = "https://github.com/akshath/job-hunter/issues"

[project.scripts]
job-hunter = "job_hunter.cli:app"
job-hunter-mcp = "job_hunter.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer intentionally calls Option()/Argument() in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
